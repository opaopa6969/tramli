name: tramli tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, tramli-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: cd lang/java && mvn test -q

  typescript:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, tramli-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Install lang/ts on its own from its lockfile, as release-core.yml does.
      # A root `npm install --legacy-peer-deps` hangs on a clean checkout and
      # ignores SIGTERM, which held the single runner indefinitely (#162).
      - run: npm ci --workspaces=false --no-audit
        working-directory: lang/ts
      - run: npm test
        working-directory: lang/ts

  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, tramli-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cd lang/rust && cargo fmt --all -- --check
      - run: cd lang/rust && cargo clippy --locked --all-targets -- -D warnings
      - run: cd lang/rust && cargo test --locked
      - run: cd lang/rust-plugins && cargo fmt --all -- --check
      - run: cd lang/rust-plugins && cargo clippy --locked --all-targets -- -D warnings
      - run: cd lang/rust-plugins && cargo test --locked

  rust-msrv:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, tramli-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.75.0
      - run: cd lang/rust && cargo build --locked
      - run: cd lang/rust-plugins && cargo build --locked

  lean:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, tramli-ci]
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1.7.1
        with:
          lake-package-directory: formal/lean
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
